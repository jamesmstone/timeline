<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="James Stone's timeline" />
    <meta name="color-scheme" content="light dark" />
    <title>Timeline</title>
  </head>
  <body>
    <div class="shell">
      <header class="masthead">
        <div>
          <h1>Timeline</h1>
          <p>Heart rate, stress, steps, music, family and reading</p>
        </div>
        <div class="search">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-3.5-3.5" />
          </svg>
          <input
            id="search"
            type="search"
            placeholder="Search"
            aria-label="Search the timeline"
          />
        </div>
      </header>
      <main id="visualization" class="board"></main>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
