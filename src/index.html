<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="James Stone's timeline" />
    <meta name="color-scheme" content="light dark" />
    <title>Timeline</title>
  </head>
  <body>
    <div class="shell">
      <header class="masthead">
        <div>
          <h1>Timeline</h1>
          <p>Heart rate, stress, sleep, steps, music, family and reading</p>
        </div>
        <div class="search">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-3.5-3.5" />
          </svg>
          <input
            id="search"
            type="search"
            placeholder="Search"
            aria-label="Search the timeline"
          />
        </div>
      </header>
      <nav class="ranges" aria-label="Jump to a time range">
        <button type="button" data-preset="today">Today</button>
        <button type="button" data-preset="yesterday">Yesterday</button>
        <button type="button" data-preset="week">Week</button>
        <button type="button" data-preset="month">Month</button>
        <button type="button" data-preset="year">Year</button>
      </nav>
      <main id="visualization" class="board"></main>
    </div>

    <svg class="ramps" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="ramp-heart" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" />
          <stop offset="1" />
        </linearGradient>
        <linearGradient id="ramp-stress" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" />
          <stop offset="1" />
        </linearGradient>
        <linearGradient id="ramp-sleep" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" />
          <stop offset="1" />
        </linearGradient>
        <linearGradient id="ramp-steps" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" />
          <stop offset="1" />
        </linearGradient>
        <linearGradient id="ramp-music" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" />
          <stop offset="1" />
        </linearGradient>
        <linearGradient id="ramp-family" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" />
          <stop offset="1" />
        </linearGradient>
        <linearGradient id="ramp-read" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" />
          <stop offset="1" />
        </linearGradient>
      </defs>
    </svg>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
